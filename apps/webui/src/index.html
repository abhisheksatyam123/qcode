<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>QCode Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/github-dark.min.css">
</head>
<body>
<div id="app">
  <!-- Mobile Sidebar Overlay -->
  <div id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-mark">Q</div>
        <div class="brand-copy">
          <h1>QCode</h1>
          <span>AI workspace</span>
        </div>
      </div>
      <button id="sidebar-close-btn" class="sidebar-close-btn" title="Close menu" aria-label="Close menu">&times;</button>
    </div>

    <!-- Views Selection -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">Views</div>
      <nav class="sidebar-nav">
        <button class="sidebar-nav-btn active" id="tab-chat-btn" type="button">
          <span class="nav-icon">💬</span> Chat
        </button>
        <button class="sidebar-nav-btn" id="tab-terminal-btn" type="button">
          <span class="nav-icon">⚡</span> Terminal
        </button>
        <button class="sidebar-nav-btn" id="tab-files-btn" type="button">
          <span class="nav-icon">📁</span> Files
        </button>
        <button class="sidebar-nav-btn" id="tab-stats-btn" type="button">
          <span class="nav-icon">📊</span> Session Stats
        </button>
      </nav>
    </div>

    <!-- Sessions Section -->
    <div class="sidebar-section flex-grow">
      <div class="sidebar-section-header">
        <div class="sidebar-section-title">Sessions</div>
        <button id="new-session-btn" class="session-add-btn" title="New session" aria-label="New session">+</button>
      </div>
      <div id="session-tabs-container" class="session-tabs-container"></div>
    </div>

    <!-- Settings Section -->
    <div class="sidebar-section sidebar-settings">
      <div class="sidebar-section-title">Settings</div>
      <div class="sidebar-controls">
        <div class="control-group">
          <label for="provider-select">Provider</label>
          <select id="provider-select"></select>
        </div>
        <div class="control-group">
          <label for="model-select">Model</label>
          <select id="model-select"></select>
        </div>
        <div class="control-group">
          <label for="reasoning-select">Reasoning</label>
          <select id="reasoning-select">
            <option value="off">Off</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button id="clear-btn">Clear Chat</button>
      <div class="connection-status" id="connection-status">
        <span class="connection-dot"></span>
        <span class="connection-label">Connected</span>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div id="main-area">
    <!-- Header replacing the old main-tabs -->
    <header id="main-header">
      <button id="menu-toggle-btn" class="menu-toggle-btn" title="Open menu" aria-label="Open menu">☰</button>
      <div class="header-session-info">
        <div class="header-session-title" id="header-session-title">No session</div>
        <div class="header-session-workspace" id="header-session-workspace"></div>
      </div>
      <div class="header-actions">
        <button class="layout-toggle-btn" id="layout-toggle-btn" title="Toggle Split View">
          <span class="layout-icon">◫</span> Split View
        </button>
      </div>
    </header>

    <div class="main-content-wrapper" id="main-content-wrapper">
      <main id="main">
        <div id="chat-container">
          <div id="messages"></div>
        </div>
        <div id="input-area">
          <div class="queue-indicator hidden" id="queue-indicator">
            <span class="queue-dot"></span>
            <span id="queue-text"></span>
          </div>
          <div class="input-wrapper">
            <textarea id="prompt-input" placeholder="Ask QCode anything…" rows="1" aria-label="Message QCode"></textarea>
            <div class="input-actions">
              <span class="input-info"><kbd>Esc</kbd> to pause &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
              <button id="pause-btn" class="pause-btn hidden" type="button" aria-label="Pause generation" title="Pause (Esc)">
                <span class="pause-icon">⏸</span><span>Pause</span>
              </button>
              <button id="send-btn" aria-label="Send message"><span>Send</span><span class="send-icon">↑</span></button>
            </div>
          </div>
        </div>
      </main>
      <div id="terminal-panel" class="hidden">
        <div class="terminal-header">
          <span>Terminal</span>
          <button id="terminal-close-btn" class="terminal-x">&times;</button>
        </div>
        <div id="terminal-container"></div>
      </div>
      <div id="files-panel" class="side-tab-panel hidden">
        <div class="side-tab-header">
          <span>📁 Files</span>
          <div class="files-header-actions">
            <div class="files-subtabs" role="tablist">
              <button type="button" class="files-subtab active" id="files-subtab-explorer" data-subtab="explorer">Explorer</button>
              <button type="button" class="files-subtab" id="files-subtab-git" data-subtab="git">Changes</button>
            </div>
            <button id="files-refresh-btn" class="side-tab-x" title="Refresh">⟳</button>
          </div>
        </div>
        <div id="files-content" class="files-content-root">
          <!-- Explorer: browser + editor -->
          <div id="files-explorer" class="files-explorer">
            <div class="fs-browser">
              <div class="fs-breadcrumb" id="fs-breadcrumb"></div>
              <div class="fs-listing" id="fs-listing">
                <div class="files-empty">Select a session to browse files.</div>
              </div>
            </div>
            <div class="fs-editor-pane" id="fs-editor-pane">
              <div class="fs-editor-toolbar">
                <span class="fs-editor-path" id="fs-editor-path">No file open</span>
                <div class="fs-editor-actions">
                  <span class="fs-dirty-badge hidden" id="fs-dirty-badge">unsaved</span>
                  <button type="button" id="fs-save-btn" class="fs-btn primary" disabled title="Save (Ctrl+S)">Save</button>
                  <button type="button" id="fs-close-btn" class="fs-btn" disabled title="Close editor">Close</button>
                </div>
              </div>
              <div class="fs-editor-wrap" id="fs-editor-wrap">
                <pre class="fs-highlight" id="fs-highlight" aria-hidden="true"><code class="hljs" id="fs-highlight-code"></code></pre>
                <!-- wrap="off" keeps long lines in sync with the <pre> highlight overlay -->
                <textarea id="fs-editor" class="fs-editor" spellcheck="false" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Open a file from the browser…" disabled></textarea>
              </div>
              <div class="fs-editor-status" id="fs-editor-status"></div>
            </div>
          </div>
          <!-- Git working-tree changes (existing) -->
          <div id="files-git" class="files-git hidden"></div>
        </div>
      </div>
      <div id="stats-panel" class="side-tab-panel hidden">
        <div class="side-tab-header">
          <span>📊 Session Stats</span>
          <button id="stats-refresh-btn" class="side-tab-x" title="Refresh">⟳</button>
        </div>
        <div id="stats-content"></div>
      </div>
    </div>
  </div>

  <div id="modal-overlay"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
<!-- Extra languages used by the file editor (not in the common bundle). -->
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/languages/cmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/languages/dockerfile.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/languages/protobuf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/languages/vim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/languages/fsharp.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
