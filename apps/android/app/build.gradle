apply plugin: 'com.android.application'

android {
    namespace 'com.qcode.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qcode.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // NDK r26 libc++ keeps <format> behind experimental; required by logger.
                cppFlags '-std=c++20 -fexceptions -frtti -fexperimental-library'
                arguments '-DANDROID_STL=c++_shared',
                        '-DQCODE_BUILD_TUI=OFF',
                        '-DQCODE_BUILD_SERVER=OFF',
                        '-DQCODE_BUILD_CLI=OFF',
                        '-DBUILD_TESTS=OFF'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // Python runtime ships some of the same SONAMEs as CMake deps (zlib/openssl).
            pickFirsts += [
                    '**/libc++_shared.so',
                    '**/libz.so',
                    '**/libssl.so',
                    '**/libcrypto.so',
                    '**/libsqlite3.so',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
